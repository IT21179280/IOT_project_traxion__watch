<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#007bff"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa5b1"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#f4f6f9"/>

  <text x="600" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#2b3440">Traxion Fall Detection Smart Watch — System Architecture</text>
  <text x="600" y="80" text-anchor="middle" font-size="14" fill="#7b8794">ESP32 watch → MQTT broker → Node.js dashboard → browser UI</text>

  <!-- Watch -->
  <rect x="40" y="250" width="250" height="150" rx="10" fill="#ffffff" stroke="#007bff" stroke-width="2"/>
  <text x="165" y="282" text-anchor="middle" font-size="17" font-weight="700" fill="#2b3440">Smart Watch (ESP32)</text>
  <text x="165" y="308" text-anchor="middle" font-size="13" fill="#52606d">MPU6050  ·  SDA 18 / SCL 19</text>
  <text x="165" y="330" text-anchor="middle" font-size="13" fill="#52606d">SSD1306 OLED  ·  SDA 22 / SCL 23</text>
  <text x="165" y="352" text-anchor="middle" font-size="13" fill="#52606d">Step / fall / calorie detection</text>
  <text x="165" y="378" text-anchor="middle" font-size="12" fill="#9aa5b1">WithDisplayDashboardFInal.ino</text>

  <!-- Watch -> Broker -->
  <line x1="290" y1="325" x2="346" y2="325" stroke="#007bff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="318" y="312" text-anchor="middle" font-size="11" fill="#007bff">JSON</text>

  <!-- Broker -->
  <rect x="350" y="280" width="250" height="90" rx="10" fill="#ffffff" stroke="#007bff" stroke-width="2"/>
  <text x="475" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#2b3440">Local MQTT Broker</text>
  <text x="475" y="330" text-anchor="middle" font-size="13" fill="#52606d">mqtt://192.168.1.3:1883</text>
  <text x="475" y="352" text-anchor="middle" font-size="13" fill="#52606d">topic: patient/data</text>

  <!-- Broker -> Dashboard -->
  <line x1="600" y1="325" x2="656" y2="325" stroke="#007bff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="628" y="312" text-anchor="middle" font-size="11" fill="#007bff">sub</text>

  <!-- Dashboard server -->
  <rect x="660" y="280" width="250" height="90" rx="10" fill="#ffffff" stroke="#007bff" stroke-width="2"/>
  <text x="785" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#2b3440">Dashboard Server</text>
  <text x="785" y="330" text-anchor="middle" font-size="13" fill="#52606d">Node.js + Express</text>
  <text x="785" y="352" text-anchor="middle" font-size="13" fill="#52606d">SSE endpoint: /events</text>

  <!-- Dashboard -> Browser -->
  <line x1="910" y1="325" x2="966" y2="325" stroke="#007bff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="938" y="312" text-anchor="middle" font-size="11" fill="#007bff">SSE</text>

  <!-- Browser UI -->
  <rect x="970" y="280" width="190" height="90" rx="10" fill="#e8f2ff" stroke="#007bff" stroke-width="2"/>
  <text x="1065" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#2b3440">Browser UI</text>
  <text x="1065" y="330" text-anchor="middle" font-size="13" fill="#52606d">Data cards</text>
  <text x="1065" y="352" text-anchor="middle" font-size="13" fill="#52606d">Gyro / Accel charts</text>

  <!-- ThingsBoard (firmware's other target) -->
  <rect x="660" y="100" width="250" height="90" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="785" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#2b3440">ThingsBoard Cloud</text>
  <text x="785" y="150" text-anchor="middle" font-size="13" fill="#52606d">v1/devices/me/telemetry</text>
  <text x="785" y="172" text-anchor="middle" font-size="13" fill="#9aa5b1">firmware's default target</text>

  <!-- Watch -> ThingsBoard dashed -->
  <polyline points="165,250 165,145 656,145" fill="none" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowGrey)"/>
  <text x="410" y="136" text-anchor="middle" font-size="12" fill="#7b8794">MQTT publish over Wi-Fi (the dashboard does not subscribe here — see README)</text>

  <!-- Email alert -->
  <rect x="660" y="450" width="250" height="86" rx="10" fill="#fff1f0" stroke="#ff4d4d" stroke-width="2"/>
  <text x="785" y="478" text-anchor="middle" font-size="16" font-weight="700" fill="#2b3440">Email Alert</text>
  <text x="785" y="500" text-anchor="middle" font-size="13" fill="#52606d">nodemailer → Gmail</text>
  <text x="785" y="522" text-anchor="middle" font-size="13" fill="#52606d">sent when fallDetected = true</text>

  <line x1="785" y1="370" x2="785" y2="446" stroke="#ff4d4d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- Fall detection note -->
  <rect x="40" y="450" width="560" height="86" rx="10" fill="#ffffff" stroke="#e4e7eb" stroke-width="1.5"/>
  <text x="60" y="480" font-size="14" font-weight="700" fill="#2b3440">Fall detection logic</text>
  <text x="60" y="504" font-size="13" fill="#52606d">Filtered acceleration magnitude &gt; 22 m/s² → fallDetected = true → red banner + email</text>
  <text x="60" y="524" font-size="13" fill="#52606d">Step threshold 12 m/s² with 300 ms debounce → stepCount, distance, calories</text>
</svg>
